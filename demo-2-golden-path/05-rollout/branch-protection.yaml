# New requirement: a change to main needs a reviewed pull request, in every repo.
# Added before `ensure-ready`, so it applies to every existing App.
- op: add
  path: /spec/pipeline/13
  value:
    step: branch-protection
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $v := index .context "platform.example.com/vars" }}
          ---
          apiVersion: repo.github.m.upbound.io/v1alpha1
          kind: BranchProtection
          metadata:
            name: {{ $v.name }}-main
            namespace: {{ $v.namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: branch-protection
          spec:
            forProvider:
              repositoryIdRef:
                name: {{ $v.name }}
              pattern: main
              enforceAdmins: true
              requiredPullRequestReviews:
                - requiredApprovingReviewCount: 1
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
