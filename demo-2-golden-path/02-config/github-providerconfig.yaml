# The secret `github-creds` is created by setup.sh from github-creds.json:
#   {"token": "<personal access token>", "owner": "<user or organisation>"}
apiVersion: github.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: github-creds
      key: credentials
